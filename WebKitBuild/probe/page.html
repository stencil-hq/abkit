<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
<style>
	body { margin: 0; font: 20px/1.5 system-ui, -apple-system, sans-serif; color: #111; background: linear-gradient(135deg, #f6d365, #fda085); }
	main { max-width: 760px; margin: 60px auto; padding: 32px 40px; background: rgba(255, 255, 255, 0.85); border-radius: 18px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); }
	h1 { margin: 0 0 12px; font-size: 44px; letter-spacing: -0.02em; }
	.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
	.grid div { height: 64px; border-radius: 12px; transform: rotate(-2deg); }
	canvas { display: block; margin-top: 20px; border-radius: 12px; }
	code { font: 15px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
	<h1>WPE WebKit on macOS</h1>
	<p>Rendered offscreen by a web process, handed to the embedder as a buffer. <b>Bold</b>, <i>italic</i>, 日本語, العربية, emoji 🙂.</p>
	<p><code id="ua"></code></p>
	<div class="grid"><div style="background:#e63946"></div><div style="background:#457b9d"></div><div style="background:#2a9d8f"></div><div style="background:#6a4c93"></div></div>
	<canvas id="c" width="680" height="120"></canvas>
</main>
<script>
	document.getElementById('ua').textContent = navigator.userAgent;
	const g = document.getElementById('c').getContext('2d');
	for (let i = 0; i < 68; i++) {
		g.fillStyle = `hsl(${i * 5.3}, 80%, 55%)`;
		g.fillRect(i * 10, 60 - Math.sin(i / 5) * 50, 8, 60 + Math.sin(i / 5) * 50);
	}
	document.title = 'probe ok: ' + [1, 2, 3].map(n => n * n).join(',') + ' ' + (typeof WebAssembly) + ' ' + getComputedStyle(document.body).fontFamily.split(',')[0];
</script>
</body>
</html>
