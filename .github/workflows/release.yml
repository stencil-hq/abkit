name: Release

# Builds the ABKit engine for the eight targets omp ships on, smoke-tests each
# on its own system (WebKitBuild/smoke-engine.py) and, for a release tag
# `v<version>`, publishes the eight archives as one build of product `abkit` on
# build.stencil.so (WebKitBuild/upload-build.sh). Run by hand it builds and
# tests without publishing. Each archive holds the packaged engine directory as
# `abkit/` (docs/installing.md).
#
# A WebKit build takes hours on these runners. Compiles go through ccache,
# saved after every build step that ran, also one the time limit stopped: a
# run that timed out is re-run (`gh run rerun --failed`) and resumes from its
# cache. Hence no build on pushes.
on:
   push:
      tags: ["v*"]
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: release-${{ github.ref }}
   cancel-in-progress: false

defaults:
   run:
      shell: bash

jobs:
   version:
      runs-on: ubuntu-24.04
      outputs:
         version: ${{ steps.version.outputs.version }}
         publish: ${{ steps.version.outputs.publish }}
      steps:
         # A release tag names the version and publishes; any other ref builds
         # a test version named after its commit.
         - id: version
           run: |
              if [[ $GITHUB_REF == refs/tags/v* ]]; then
                 version=${GITHUB_REF_NAME#v}
                 [[ $version =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]] ||
                    { echo "::error::$GITHUB_REF_NAME does not name a version"; exit 1; }
                 echo "publish=true" >>"$GITHUB_OUTPUT"
              else
                 version=0.0.0-${GITHUB_SHA::12}
                 echo "publish=false" >>"$GITHUB_OUTPUT"
              fi
              echo "version=$version" >>"$GITHUB_OUTPUT"

   build:
      name: Build ${{ matrix.target }}
      needs: version
      strategy:
         fail-fast: false
         matrix:
            include:
               - { target: darwin-arm64, os: macos-15, script: darwin, platform: macos, arch: arm64 }
               - { target: darwin-x64, os: macos-15-intel, script: darwin, platform: macos, arch: x86_64 }
               - { target: linux-x64, os: ubuntu-24.04, script: linux, platform: linux, arch: x86_64 }
               - { target: linux-arm64, os: ubuntu-24.04-arm, script: linux, platform: linux, arch: arm64 }
               - { target: linux-musl-x64, os: ubuntu-24.04, script: linux, platform: linux-musl, arch: x86_64 }
               - { target: linux-musl-arm64, os: ubuntu-24.04-arm, script: linux, platform: linux-musl, arch: arm64 }
               # Cross-compiled; tested by the smoke-windows job on Windows.
               - { target: windows-x64, os: ubuntu-24.04, script: win, platform: windows, arch: x86_64 }
               - { target: windows-arm64, os: ubuntu-24.04, script: win, platform: windows, arch: arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 360
      env:
         CCACHE_DIR: ${{ github.workspace }}/.ccache
         CCACHE_MAXSIZE: 1500M
         ARCHIVE: abkit-${{ needs.version.outputs.version }}-${{ matrix.target }}
      steps:
         # The tests and the website are most of the repository and none of the build.
         - uses: actions/checkout@v7
           with:
              fetch-depth: 1
              sparse-checkout: |
                 .github
                 Source
                 Tools
                 WebKitBuild
                 WebKitLibraries
                 docs
              sparse-checkout-cone-mode: true

         # The runners' own resolver (Azure's) has been failing to resolve ubuntu.com, apt's
         # mirrors; public resolvers answer. Containers started with --network host follow.
         - name: Resolve through public DNS
           if: startsWith(matrix.os, 'ubuntu-')
           run: |
              sudo mkdir -p /etc/systemd/resolved.conf.d
              printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
              sudo systemctl restart systemd-resolved
              getent hosts archive.ubuntu.com

         # The hosted image's SDKs and toolchains leave too little room for a WebKit build.
         - name: Free disk space
           if: startsWith(matrix.os, 'ubuntu-')
           run: |
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
              df -h "$GITHUB_WORKSPACE"

         - uses: actions/cache/restore@v6
           with:
              path: .ccache
              key: ccache-${{ matrix.target }}-${{ github.sha }}
              restore-keys: ccache-${{ matrix.target }}-

         - name: Build
           timeout-minutes: 330
           run: WebKitBuild/${{ matrix.script }}/build-engine.sh "${{ matrix.target }}" "$PWD/dist/abkit"

         - uses: actions/cache/save@v6
           if: always() && hashFiles('.ccache/**') != ''
           with:
              path: .ccache
              key: ccache-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}

         - name: Smoke test
           if: matrix.platform != 'windows'
           run: python3 WebKitBuild/smoke-engine.py dist/abkit

         - name: Archive
           run: |
              cd dist
              if [[ ${{ matrix.platform }} == windows ]]; then
                 zip -qr "$ARCHIVE.zip" abkit
              else
                 tar -czf "$ARCHIVE.tar.gz" abkit
              fi
              ls -l abkit-*

         - uses: actions/upload-artifact@v7
           with:
              name: ${{ matrix.target }}
              path: dist/abkit-*
              if-no-files-found: error

   smoke-windows:
      name: Smoke test ${{ matrix.target }}
      needs: [version, build]
      strategy:
         fail-fast: false
         matrix:
            include:
               - { target: windows-x64, os: windows-2025 }
               - { target: windows-arm64, os: windows-11-arm }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v7
           with:
              sparse-checkout: WebKitBuild/smoke-engine.py
              sparse-checkout-cone-mode: false
         - uses: actions/download-artifact@v8
           with:
              name: ${{ matrix.target }}
              path: dist
         - shell: pwsh
           run: |
              Expand-Archive -Path (Get-Item dist/abkit-*.zip).FullName -DestinationPath dist
              python WebKitBuild/smoke-engine.py dist/abkit

   publish:
      needs: [version, build, smoke-windows]
      if: needs.version.outputs.publish == 'true'
      runs-on: ubuntu-24.04
      permissions:
         contents: read
         id-token: write
      steps:
         - uses: actions/checkout@v7
           with:
              sparse-checkout: WebKitBuild/upload-build.sh
              sparse-checkout-cone-mode: false
         - uses: actions/download-artifact@v8
           with:
              path: dist
              merge-multiple: true
         - name: Publish to build.stencil.so
           run: |
              v=${{ needs.version.outputs.version }}
              WebKitBuild/upload-build.sh "$v" \
                 "dist/abkit-$v-darwin-arm64.tar.gz:macos:arm64" \
                 "dist/abkit-$v-darwin-x64.tar.gz:macos:x86_64" \
                 "dist/abkit-$v-linux-x64.tar.gz:linux:x86_64" \
                 "dist/abkit-$v-linux-arm64.tar.gz:linux:arm64" \
                 "dist/abkit-$v-linux-musl-x64.tar.gz:linux-musl:x86_64" \
                 "dist/abkit-$v-linux-musl-arm64.tar.gz:linux-musl:arm64" \
                 "dist/abkit-$v-windows-x64.zip:windows:x86_64" \
                 "dist/abkit-$v-windows-arm64.zip:windows:arm64"
