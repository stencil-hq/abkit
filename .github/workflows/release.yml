name: Release

# Builds the ABKit engine for the eight targets omp ships on, smoke-tests each
# on its own system (WebKitBuild/smoke-engine.py) and, for a release tag
# `v<version>`, publishes the eight archives as one build of product `abkit` on
# build.stencil.so (WebKitBuild/upload-build.sh). Run by hand it builds and
# tests without publishing, every target or those its `targets` input names.
# Each archive holds the packaged engine directory as `abkit/`
# (docs/installing.md).
#
# The macOS engines are signed with the Developer ID of the
# MACOS_CERTIFICATE_P12 secret (WebKitBuild/package-engine.sh: hardened
# runtime, secure timestamp) and notarized with the App Store Connect key of
# APPLE_API_KEY_P8 (WebKitBuild/darwin/notarize-engine.sh), the secrets Tern's
# release uses; a tag's build fails without them, one by hand signs ad hoc.
#
# Runners, as Tern's (apps/build/README.md in the monorepo): x86_64 Linux hosts
# are vmon microVMs on our cluster (`vmon-small`, `vmon-xlarge`: 16 vCPU), which
# build linux-x64 and linux-musl-x64 in containers and cross-compile both
# Windows targets; vmon has no arm64 or macOS hosts, so the arm64 Linux
# targets and both Macs build on Blacksmith (darwin-x64 under Rosetta, see
# WebKitBuild/darwin/build-engine.sh). Compiles go through ccache, saved
# after every build step that ran, also one the time limit stopped: a run that
# timed out is re-run (`gh run rerun --failed`) and resumes from its cache.
on:
   push:
      tags: ["v*"]
   workflow_dispatch:
      inputs:
         targets:
            description: "Targets to build, comma-separated (empty: all)"
            type: string
            default: ""

permissions:
   contents: read

concurrency:
   group: release-${{ github.ref }}
   cancel-in-progress: false

defaults:
   run:
      shell: bash

jobs:
   version:
      runs-on: vmon-small
      outputs:
         version: ${{ steps.version.outputs.version }}
         publish: ${{ steps.version.outputs.publish }}
         build: ${{ steps.targets.outputs.build }}
         elsewhere: ${{ steps.targets.outputs.elsewhere }}
      steps:
         # A release tag names the version and publishes; any other ref builds
         # a test version named after its commit.
         - id: version
           run: |
              if [[ $GITHUB_REF == refs/tags/v* ]]; then
                 version=${GITHUB_REF_NAME#v}
                 [[ $version =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]] ||
                    { echo "::error::$GITHUB_REF_NAME does not name a version"; exit 1; }
                 echo "publish=true" >>"$GITHUB_OUTPUT"
              else
                 version=0.0.0-${GITHUB_SHA::12}
                 echo "publish=false" >>"$GITHUB_OUTPUT"
              fi
              echo "version=$version" >>"$GITHUB_OUTPUT"
         # The targets this run builds: all of them for a release; a run by
         # hand may name some. A target with `test` is cross-compiled and
         # tested on that runner by the smoke-elsewhere job.
         - id: targets
           env:
              TARGETS: ${{ inputs.targets }}
           run: |
              all='[
                 {"target": "darwin-arm64", "os": "blacksmith-12vcpu-macos-26", "script": "darwin", "platform": "macos", "arch": "arm64"},
                 {"target": "darwin-x64", "os": "blacksmith-12vcpu-macos-26", "script": "darwin", "platform": "macos", "arch": "x86_64"},
                 {"target": "linux-x64", "os": "vmon-xlarge", "script": "linux", "platform": "linux", "arch": "x86_64"},
                 {"target": "linux-arm64", "os": "blacksmith-16vcpu-ubuntu-2404-arm", "script": "linux", "platform": "linux", "arch": "arm64"},
                 {"target": "linux-musl-x64", "os": "vmon-xlarge", "script": "linux", "platform": "linux-musl", "arch": "x86_64"},
                 {"target": "linux-musl-arm64", "os": "blacksmith-16vcpu-ubuntu-2404-arm", "script": "linux", "platform": "linux-musl", "arch": "arm64"},
                 {"target": "windows-x64", "os": "vmon-xlarge", "script": "win", "platform": "windows", "arch": "x86_64", "test": "windows-2025"},
                 {"target": "windows-arm64", "os": "vmon-xlarge", "script": "win", "platform": "windows", "arch": "arm64", "test": "windows-11-arm"}
              ]'
              if [[ $GITHUB_REF == refs/tags/v* || -z $TARGETS ]]; then
                 build=$(jq -c . <<<"$all")
              else
                 build=$(jq -c --arg wanted ",${TARGETS// /}," '[.[] | select(.target as $t | $wanted | contains("," + $t + ","))]' <<<"$all")
                 [[ $build != '[]' ]] || { echo "::error::no target named in '$TARGETS'"; exit 1; }
              fi
              echo "build={\"include\":$build}" >>"$GITHUB_OUTPUT"
              echo "elsewhere={\"include\":$(jq -c '[.[] | select(.test)]' <<<"$build")}" >>"$GITHUB_OUTPUT"

   build:
      name: Build ${{ matrix.target }}
      needs: version
      strategy:
         fail-fast: false
         matrix: ${{ fromJSON(needs.version.outputs.build) }}
      runs-on: ${{ matrix.os }}
      timeout-minutes: 360
      env:
         CCACHE_DIR: ${{ github.workspace }}/.ccache
         CCACHE_MAXSIZE: 1500M
         ARCHIVE: abkit-${{ needs.version.outputs.version }}-${{ matrix.target }}
         TARGET: ${{ matrix.target }}
         SCRIPT: ${{ matrix.script }}
         PLATFORM: ${{ matrix.platform }}
      steps:
         # The tests and the website are most of the repository and none of the build.
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
              fetch-depth: 1
              sparse-checkout: |
                 .github
                 Source
                 Tools
                 WebKitBuild
                 WebKitLibraries
                 docs
              sparse-checkout-cone-mode: true

         - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: .ccache
              key: ccache-${{ matrix.target }}-${{ github.sha }}
              restore-keys: ccache-${{ matrix.target }}-

         # The Developer ID package-engine.sh signs the macOS engine with, in a
         # keychain of the job's own.
         - name: Signing identity
           if: matrix.script == 'darwin'
           env:
              MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
              MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
           run: |
              if [[ -z $MACOS_CERTIFICATE_P12 ]]; then
                 if [[ $GITHUB_REF == refs/tags/v* ]]; then
                    echo "::error::the MACOS_CERTIFICATE_P12 secret is unset: a release is signed with its Developer ID"
                    exit 1
                 fi
                 echo "::notice::MACOS_CERTIFICATE_P12 is unset: the engine is signed ad hoc"
                 exit 0
              fi
              keychain=$RUNNER_TEMP/signing.keychain-db
              password=$(openssl rand -hex 24)
              security create-keychain -p "$password" "$keychain"
              security set-keychain-settings -lut 21600 "$keychain"
              security unlock-keychain -p "$password" "$keychain"
              printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/identity.p12"
              security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              rm "$RUNNER_TEMP/identity.p12"
              # Lets codesign use the key without a dialog.
              security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
              keychains=("$keychain")
              while IFS= read -r line; do
                 line=${line#*\"}
                 keychains+=("${line%\"}")
              done < <(security list-keychains -d user)
              security list-keychains -d user -s "${keychains[@]}"
              identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
              if [[ -z $identity ]]; then
                 echo "::error::MACOS_CERTIFICATE_P12 holds no Developer ID Application identity"
                 exit 1
              fi
              echo "MACOS_SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

         - name: Build
           timeout-minutes: 330
           run: WebKitBuild/"$SCRIPT"/build-engine.sh "$TARGET" "$PWD/dist/abkit"

         - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           if: always() && hashFiles('.ccache/**') != ''
           with:
              path: .ccache
              key: ccache-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}

         # A musl engine needs a musl system: the runners lack its ELF interpreter, /lib/ld-musl-*.so.1.
         - name: Smoke test
           if: ${{ !matrix.test }}
           run: |
              if [[ $PLATFORM == linux-musl ]]; then
                 docker run --rm --network host -v "$PWD:/w" -w /w alpine:3.22 \
                    sh -c 'apk add -q python3 && python3 WebKitBuild/smoke-engine.py dist/abkit'
              else
                 python3 WebKitBuild/smoke-engine.py dist/abkit
              fi

         # After the smoke test, which ran the engine under the hardened runtime.
         - name: Notarize
           if: matrix.script == 'darwin' && env.MACOS_SIGN_IDENTITY != ''
           env:
              APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
           run: |
              printf '%s' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary.p8"
              WebKitBuild/darwin/notarize-engine.sh dist/abkit "$RUNNER_TEMP/notary.p8"

         - name: Archive
           run: |
              cd dist
              if [[ $PLATFORM == windows ]]; then
                 zip -qr "$ARCHIVE.zip" abkit
              else
                 tar -czf "$ARCHIVE.tar.gz" abkit
              fi
              ls -l abkit-*

         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: ${{ matrix.target }}
              path: dist/abkit-*
              if-no-files-found: error

         - name: Remove the signing keychain
           if: always() && matrix.script == 'darwin'
           run: |
              security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
              rm -f "$RUNNER_TEMP/notary.p8"

   # The engines tested on another runner than the one that built them, once
   # the builds are done, also when another target's build failed.
   smoke-elsewhere:
      name: Smoke test ${{ matrix.target }}
      needs: [version, build]
      if: ${{ !cancelled() && needs.version.outputs.elsewhere != '{"include":[]}' }}
      strategy:
         fail-fast: false
         matrix: ${{ fromJSON(needs.version.outputs.elsewhere) }}
      runs-on: ${{ matrix.test }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
              sparse-checkout: WebKitBuild/smoke-engine.py
              sparse-checkout-cone-mode: false
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              name: ${{ matrix.target }}
              path: dist
         - if: runner.os == 'Windows'
           shell: pwsh
           run: |
              Expand-Archive -Path (Get-Item dist/abkit-*.zip).FullName -DestinationPath dist
              python WebKitBuild/smoke-engine.py dist/abkit
         - if: runner.os == 'macOS'
           run: |
              /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
              tar -xzf dist/abkit-*.tar.gz -C dist
              python3 WebKitBuild/smoke-engine.py dist/abkit

   publish:
      needs: [version, build, smoke-elsewhere]
      if: needs.version.outputs.publish == 'true'
      runs-on: vmon-small
      permissions:
         contents: read
         id-token: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
              sparse-checkout: WebKitBuild/upload-build.sh
              sparse-checkout-cone-mode: false
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              path: dist
              merge-multiple: true
         - name: Publish to build.stencil.so
           env:
              v: ${{ needs.version.outputs.version }}
           run: |
              WebKitBuild/upload-build.sh "$v" \
                 "dist/abkit-$v-darwin-arm64.tar.gz:macos:arm64" \
                 "dist/abkit-$v-darwin-x64.tar.gz:macos:x86_64" \
                 "dist/abkit-$v-linux-x64.tar.gz:linux:x86_64" \
                 "dist/abkit-$v-linux-arm64.tar.gz:linux:arm64" \
                 "dist/abkit-$v-linux-musl-x64.tar.gz:linux-musl:x86_64" \
                 "dist/abkit-$v-linux-musl-arm64.tar.gz:linux-musl:arm64" \
                 "dist/abkit-$v-windows-x64.zip:windows:x86_64" \
                 "dist/abkit-$v-windows-arm64.zip:windows:arm64"
