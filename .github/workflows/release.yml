name: Release

# Builds the ABKit engine for the eight targets omp ships on, smoke-tests each
# on its own system (WebKitBuild/smoke-engine.py) and, for a release tag
# `v<version>`, publishes the eight archives as one build of product `abkit` on
# build.stencil.so (WebKitBuild/upload-build.sh). Run by hand it builds and
# tests without publishing, every target or those its `targets` input names.
# Each archive holds the packaged engine directory as `abkit/`
# (docs/installing.md).
#
# Runners, as Tern's (apps/build/README.md in the monorepo): x86_64 Linux hosts
# are vmon microVMs on our cluster (`vmon-small`, `vmon-xlarge`: 16 vCPU), which
# build linux-x64 and linux-musl-x64 in containers and cross-compile both
# Windows targets; vmon has no arm64 or macOS hosts, so the arm64 Linux
# targets and darwin-arm64 build on Blacksmith, darwin-x64 on GitHub's Intel
# Macs. Compiles go through ccache, saved
# after every build step that ran, also one the time limit stopped: a run that
# timed out is re-run (`gh run rerun --failed`) and resumes from its cache.
on:
   push:
      tags: ["v*"]
   workflow_dispatch:
      inputs:
         targets:
            description: "Targets to build, comma-separated (empty: all)"
            type: string
            default: ""

permissions:
   contents: read

concurrency:
   group: release-${{ github.ref }}
   cancel-in-progress: false

defaults:
   run:
      shell: bash

jobs:
   version:
      runs-on: vmon-small
      outputs:
         version: ${{ steps.version.outputs.version }}
         publish: ${{ steps.version.outputs.publish }}
         build: ${{ steps.targets.outputs.build }}
         elsewhere: ${{ steps.targets.outputs.elsewhere }}
      steps:
         # A release tag names the version and publishes; any other ref builds
         # a test version named after its commit.
         - id: version
           run: |
              if [[ $GITHUB_REF == refs/tags/v* ]]; then
                 version=${GITHUB_REF_NAME#v}
                 [[ $version =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]] ||
                    { echo "::error::$GITHUB_REF_NAME does not name a version"; exit 1; }
                 echo "publish=true" >>"$GITHUB_OUTPUT"
              else
                 version=0.0.0-${GITHUB_SHA::12}
                 echo "publish=false" >>"$GITHUB_OUTPUT"
              fi
              echo "version=$version" >>"$GITHUB_OUTPUT"
         # The targets this run builds: all of them for a release; a run by
         # hand may name some. A target with `test` is tested on that runner
         # by the smoke-elsewhere job: the Windows targets are cross-compiled,
         # and darwin-x64 builds on GitHub's Intel Macs (the only x86_64
         # Homebrew left: its installer refuses Intel Macs now), virtual
         # machines without the Metal device the engine draws with, so it runs
         # under Rosetta on an Apple-silicon Mac.
         - id: targets
           env:
              TARGETS: ${{ inputs.targets }}
           run: |
              all='[
                 {"target": "darwin-arm64", "os": "blacksmith-12vcpu-macos-26", "script": "darwin", "platform": "macos", "arch": "arm64"},
                 {"target": "darwin-x64", "os": "macos-15-intel", "script": "darwin", "platform": "macos", "arch": "x86_64", "test": "blacksmith-12vcpu-macos-26"},
                 {"target": "linux-x64", "os": "vmon-xlarge", "script": "linux", "platform": "linux", "arch": "x86_64"},
                 {"target": "linux-arm64", "os": "blacksmith-16vcpu-ubuntu-2404-arm", "script": "linux", "platform": "linux", "arch": "arm64"},
                 {"target": "linux-musl-x64", "os": "vmon-xlarge", "script": "linux", "platform": "linux-musl", "arch": "x86_64"},
                 {"target": "linux-musl-arm64", "os": "blacksmith-16vcpu-ubuntu-2404-arm", "script": "linux", "platform": "linux-musl", "arch": "arm64"},
                 {"target": "windows-x64", "os": "vmon-xlarge", "script": "win", "platform": "windows", "arch": "x86_64", "test": "windows-2025"},
                 {"target": "windows-arm64", "os": "vmon-xlarge", "script": "win", "platform": "windows", "arch": "arm64", "test": "windows-11-arm"}
              ]'
              if [[ $GITHUB_REF == refs/tags/v* || -z $TARGETS ]]; then
                 build=$(jq -c . <<<"$all")
              else
                 build=$(jq -c --arg wanted ",${TARGETS// /}," '[.[] | select(.target as $t | $wanted | contains("," + $t + ","))]' <<<"$all")
                 [[ $build != '[]' ]] || { echo "::error::no target named in '$TARGETS'"; exit 1; }
              fi
              echo "build={\"include\":$build}" >>"$GITHUB_OUTPUT"
              echo "elsewhere={\"include\":$(jq -c '[.[] | select(.test)]' <<<"$build")}" >>"$GITHUB_OUTPUT"

   build:
      name: Build ${{ matrix.target }}
      needs: version
      strategy:
         fail-fast: false
         matrix: ${{ fromJSON(needs.version.outputs.build) }}
      runs-on: ${{ matrix.os }}
      timeout-minutes: 360
      env:
         CCACHE_DIR: ${{ github.workspace }}/.ccache
         CCACHE_MAXSIZE: 1500M
         ARCHIVE: abkit-${{ needs.version.outputs.version }}-${{ matrix.target }}
      steps:
         # The tests and the website are most of the repository and none of the build.
         - uses: actions/checkout@v7
           with:
              fetch-depth: 1
              sparse-checkout: |
                 .github
                 Source
                 Tools
                 WebKitBuild
                 WebKitLibraries
                 docs
              sparse-checkout-cone-mode: true

         - uses: actions/cache/restore@v6
           with:
              path: .ccache
              key: ccache-${{ matrix.target }}-${{ github.sha }}
              restore-keys: ccache-${{ matrix.target }}-

         - name: Build
           timeout-minutes: 330
           run: WebKitBuild/${{ matrix.script }}/build-engine.sh "${{ matrix.target }}" "$PWD/dist/abkit"

         - uses: actions/cache/save@v6
           if: always() && hashFiles('.ccache/**') != ''
           with:
              path: .ccache
              key: ccache-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}

         # A musl engine needs a musl system: the runners lack its ELF interpreter, /lib/ld-musl-*.so.1.
         - name: Smoke test
           if: ${{ !matrix.test }}
           run: |
              if [[ ${{ matrix.platform }} == linux-musl ]]; then
                 docker run --rm --network host -v "$PWD:/w" -w /w alpine:3.22 \
                    sh -c 'apk add -q python3 && python3 WebKitBuild/smoke-engine.py dist/abkit'
              else
                 python3 WebKitBuild/smoke-engine.py dist/abkit
              fi

         - name: Archive
           run: |
              cd dist
              if [[ ${{ matrix.platform }} == windows ]]; then
                 zip -qr "$ARCHIVE.zip" abkit
              else
                 tar -czf "$ARCHIVE.tar.gz" abkit
              fi
              ls -l abkit-*

         - uses: actions/upload-artifact@v7
           with:
              name: ${{ matrix.target }}
              path: dist/abkit-*
              if-no-files-found: error

   # The engines tested on another runner than the one that built them, once
   # the builds are done, also when another target's build failed.
   smoke-elsewhere:
      name: Smoke test ${{ matrix.target }}
      needs: [version, build]
      if: ${{ !cancelled() && needs.version.outputs.elsewhere != '{"include":[]}' }}
      strategy:
         fail-fast: false
         matrix: ${{ fromJSON(needs.version.outputs.elsewhere) }}
      runs-on: ${{ matrix.test }}
      steps:
         - uses: actions/checkout@v7
           with:
              sparse-checkout: WebKitBuild/smoke-engine.py
              sparse-checkout-cone-mode: false
         - uses: actions/download-artifact@v8
           with:
              name: ${{ matrix.target }}
              path: dist
         - if: runner.os == 'Windows'
           shell: pwsh
           run: |
              Expand-Archive -Path (Get-Item dist/abkit-*.zip).FullName -DestinationPath dist
              python WebKitBuild/smoke-engine.py dist/abkit
         - if: runner.os == 'macOS'
           run: |
              /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
              tar -xzf dist/abkit-*.tar.gz -C dist
              python3 WebKitBuild/smoke-engine.py dist/abkit

   publish:
      needs: [version, build, smoke-elsewhere]
      if: needs.version.outputs.publish == 'true'
      runs-on: vmon-small
      permissions:
         contents: read
         id-token: write
      steps:
         - uses: actions/checkout@v7
           with:
              sparse-checkout: WebKitBuild/upload-build.sh
              sparse-checkout-cone-mode: false
         - uses: actions/download-artifact@v8
           with:
              path: dist
              merge-multiple: true
         - name: Publish to build.stencil.so
           run: |
              v=${{ needs.version.outputs.version }}
              WebKitBuild/upload-build.sh "$v" \
                 "dist/abkit-$v-darwin-arm64.tar.gz:macos:arm64" \
                 "dist/abkit-$v-darwin-x64.tar.gz:macos:x86_64" \
                 "dist/abkit-$v-linux-x64.tar.gz:linux:x86_64" \
                 "dist/abkit-$v-linux-arm64.tar.gz:linux:arm64" \
                 "dist/abkit-$v-linux-musl-x64.tar.gz:linux-musl:x86_64" \
                 "dist/abkit-$v-linux-musl-arm64.tar.gz:linux-musl:arm64" \
                 "dist/abkit-$v-windows-x64.zip:windows:x86_64" \
                 "dist/abkit-$v-windows-arm64.zip:windows:arm64"
